<script>/* shared.js */
// Small helpers for report.js: theme tokens, tooltip, formats, sortable table.

// Resolved theme tokens (Plot writes SVG attributes, which cannot hold var()).
window.tok = () => {
	const s = getComputedStyle(document.documentElement);
	const t = {};
	for (const k of ["paper", "paper-2", "ink", "muted", "rule", "accent", "good", "bad",
		"c1", "c2", "c3", "c4", "c5", "c6", "sans", "mono", "serif"]) t[k] = s.getPropertyValue("--" + k).trim();
	t.series = [t.c1, t.c2, t.c3, t.c4, t.c5, t.c6];
	return t;
};

// Tooltip body: head (+ muted sub), optional lead line, label/value rows, notes, interaction hint. Values pre-escaped.
window.tipHtml = ({ head, sub = "", lead = "", rows = [], notes = [], hint = "" }) =>
	`<div class="tt-h">${head}${sub ? `<span>${sub}</span>` : ""}</div>`
	+ (lead ? `<div class="tt-l">${lead}</div>` : "")
	+ (rows.length ? `<dl>${rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl>` : "")
	+ notes.map((n) => `<p class="tt-n">${n}</p>`).join("")
	+ (hint ? `<p class="tt-hint">${hint}</p>` : "");

// One floating tooltip: tip.show(evt, html), tip.hide().
window.tip = (() => {
	let el;
	const ensure = () => el || (el = Object.assign(document.body.appendChild(document.createElement("div")), { className: "tip" }));
	return {
		show(e, html) {
			const t = ensure();
			t.innerHTML = html;
			t.classList.add("on");
			const r = t.getBoundingClientRect();
			const x = Math.min(e.clientX + 14, innerWidth - r.width - 8);
			const y = e.clientY + 14 + r.height > innerHeight ? e.clientY - r.height - 10 : e.clientY + 14;
			t.style.left = x + "px";
			t.style.top = y + "px";
		},
		hide() { el && el.classList.remove("on"); },
	};
})();

// HTML-escape for any data string put in innerHTML.
window.esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

// Combos in first-run order with short labels and stable colours (same in every variant).
// combos(D) -> [{key, short, color, first}], comboOf(D)(key) -> that record.
const COMBO_COLORS = {
	light: ["#4f5d75", "#3f74c4", "#8a7a5c", "#4f7f6b", "#86608e", "#b0703a", "#3f7f96", "#7d7d7d"],
	dark: ["#9aa5bd", "#739fdf", "#c9b68f", "#8fc0ab", "#c7a6cf", "#e0a370", "#7fb8cc", "#b5b5b5"],
};
const MODEL_SHORT = (m) => (m || "?").replace(/-5-5$/, "").replace(/-v4\.1-flash-1017$/, "-flash").replace(/-5\.3-flash$/, "-flash");
window.combos = (D) => {
	const first = new Map();
	for (const r of D.cycles) if (!first.has(r.combo)) first.set(r.combo, { first: r.cycle, parts: r.combo_parts });
	const pal = COMBO_COLORS[matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"];
	return [...first].sort((a, b) => a[1].first - b[1].first).map(([key, v], i) => ({
		key, first: v.first, color: pal[i % pal.length],
		short: `build ${MODEL_SHORT(v.parts.default)} · orch ${MODEL_SHORT(v.parts.orch)} · eyes ${MODEL_SHORT(v.parts.eyes)}`,
	}));
};
window.comboOf = (D) => {
	const m = new Map(combos(D).map((c) => [c.key, c]));
	return (k) => m.get(k);
};

// Number formats used across variants. pp = percentage-point delta (never relative % of a percentage).
window.fmt = {
	usd: (v) => v == null ? "–" : "$" + (Math.abs(v) < 1 ? v.toFixed(3) : v.toFixed(2)),
	min: (v) => v == null ? "–" : v < 60 ? Math.round(v) + " min" : (v / 60).toFixed(1) + " h",
	pct: (v) => v == null ? "–" : Math.round(v) + "%",
	pp: (v) => v == null ? "–" : ((r) => (r > 0 ? "+" : r < 0 ? "−" : "±") + Math.abs(r) + " pp")(Math.round(v)),
	n: (v) => v == null ? "–" : (+v).toLocaleString("en"),
	x: (v) => v == null ? "–" : (+v).toFixed(2) + "×",
	n1: (v) => v == null ? "–" : (+v).toFixed(1),
};

// Fewer runs than this on either side of a comparison: show the numbers, withhold the better/worse verdict.
window.LOW_N = 3;

			const kept = [];
			const xs = D.events.map((e) => x(RUNS.findIndex((r) => r.cycle === e.cycle)) - x.step() * 0.125);
			for (const e of [...D.events].sort((a, b) => b.cycle - a.cycle)) {
				const ex = x(RUNS.findIndex((r) => r.cycle === e.cycle)) - x.step() * 0.125;
				for (const txt of [`${e.cycle} ${e.kinds[0] ?? ""}`.trim(), String(e.cycle)]) {
					const tw = textW(txt);
					const slot = [false, true].map((left) => (left ? ex - 3 - tw : ex + 3)).map((a, i) => ({ left: i === 1, a, b: a + tw }))
						.find(({ a, b }) => a >= 0 && b <= w && !kept.some(([p, q]) => a < q + TICK_GAP && b > p - TICK_GAP) && !xs.some((l) => Math.abs(l - ex) > 0.5 && l > a - 2 && l < b + 2));
					if (!slot) continue;
					kept.push([slot.a, slot.b]);
					svg.append("text").attr("x", slot.left ? ex - 3 : ex + 3).attr("y", 10).attr("text-anchor", slot.left ? "end" : "start").attr("fill", t.muted).text(txt);
					break;
				}
			}
			// column i owns its bar plus half the gap on each side
			const idxAt = (px) => Math.max(0, Math.min(RUNS.length - 1, Math.floor((px + x.step() * 0.125) / x.step())));
			// a press that barely moves is a click (opens the run), also inside the brushed range where d3 would start a move
			let downX = null;
			svg.node().addEventListener("pointerdown", (e) => (downX = d3.pointer(e, svg.node())[0]), true);
			const brush = d3.brushX().extent([[0, 0], [w, h]]).on("end", (e) => {
				if (!e.sourceEvent) return;
				const [px] = d3.pointer(e.sourceEvent, svg.node());
				if (!e.selection || (downX != null && Math.abs(px - downX) < 4)) return openRun(RUNS[idxAt(px)].cycle);
				const [a, b] = e.selection;
				setRange(idxAt(a + x.bandwidth() / 2), idxAt(b - x.bandwidth() / 2));
			});
			const bg = svg.append("g").call(brush);
			bg.call(brush.move, [x(st.lo) - 1, x(st.hi) + x.bandwidth() + 1]);
			bg.selectAll(".overlay,.selection").style("cursor", "pointer");
			svg.on("pointermove", (e) => {
				const i = idxAt(d3.pointer(e)[0]), r = RUNS[i];
				band.attr("x", x(i) - x.step() * 0.125).attr("visibility", "visible");
				const evs = D.events.filter((v) => v.cycle === r.cycle);
				tip.show(e, runTip(r, [], evs.map((v) => `event: ${esc(v.label)}`), "click opens run · drag to filter · double-click resets"));
			}).on("pointerleave", () => (band.attr("visibility", "hidden"), tip.hide())).on("dblclick", () => setRange(0, RUNS.length - 1));
		};

		const drawQ1 = (v) => {
			const tr = new Map(D.charts.g1_trend.rows.map((r) => [r.run, r]));
			const rows = v.map((r) => ({ ...tr.get(r.cycle), r }));
			put($(".c-cost"), rows, (rs) => {
				const p = base($(".c-cost"), {
					x: xRun(v, $(".c-cost")), y: { grid: true, label: "USD", tickFormat: (d) => "$" + d },
					marks: [Plot.lineY(rs, { x: "run", y: "rolling_median_5", stroke: t.muted, strokeDasharray: "4 3" }),
						Plot.dot(rs, { x: "run", y: "cost", r: (d) => (d.run === st.sel ? 6 : 4), fill: (d) => markFill(d.r) })],
				});
				hook(p, 'g[aria-label="dot"] circle', rs, (d) => runTip(d.r, [["rolling median (5)", fmt.usd(d.rolling_median_5)]], [], "click opens run"), openFromRow);
				return p;
			});
			put($(".c-par1"), v.filter((r) => r.parallelism != null), (rs) => {
				const p = base($(".c-par1"), {
					x: xRun(v, $(".c-par1")), y: { grid: true, label: null, tickFormat: (d) => d + "×", domain: [0, Math.max(1.1, d3.max(rs, (r) => r.parallelism))] },
					marks: [Plot.ruleY([1], { stroke: t.muted, strokeDasharray: "4 3" }),
						Plot.lineY(rs, { x: "cycle", y: "parallelism", stroke: t.c6 }),
						Plot.dot(rs, { x: "cycle", y: "parallelism", r: (d) => (d.cycle === st.sel ? 6 : 4), fill: markFill })],
				});
				hook(p, 'g[aria-label="dot"] circle', rs, (d) => runTip(d, [], [], "click opens run"), openFromRow);
				return p;
			});
			const tm = new Map(D.charts.g3_time.rows.map((r) => [r.run, r]));
			const tots = v.map((r) => tm.get(r.cycle).active_min + tm.get(r.cycle).idle_min).sort((a, b) => a - b);
			const cap = 4 * (tots[tots.length >> 1] ?? 0); // outliers (a stalled run) are cut here and labelled, so they cannot flatten the rest
			const tl = v.flatMap((r) => [["active", tm.get(r.cycle).active_min], ["idle", tm.get(r.cycle).idle_min]].map(([k, m]) => ({ run: r.cycle, k, m, shown: k === "idle" ? Math.max(0, Math.min(m, cap - tm.get(r.cycle).active_min)) : m, cut: k === "idle" && tm.get(r.cycle).active_min + m > cap })));
			put($(".c-time"), tl, (rs) => {
				const p = base($(".c-time"), {
					x: xBand(v, $(".c-time")),
					y: { grid: true, label: "minutes" },
					marks: [Plot.barY(rs, { x: "run", y: "shown", z: "k", fill: (d) => (d.k === "active" ? t.c2 : t.c3), stroke: (d) => (d.run === st.sel ? t.accent : "none"), strokeWidth: 2 }), Plot.text(rs.filter((d) => d.cut), { x: "run", y: () => cap, text: (d) => `▲ idle ${fmt.min(d.m)}`, dy: -8, textAnchor: "end", fill: t.ink, fontSize: 11 })],
				});
				hook(p, 'g[aria-label="bar"] rect', rs, (d) => tipHtml({ head: `Run ${d.run}`, rows: [[d.k, fmt.min(d.m)]], hint: "click opens run" }), openFromRow);
				return p;
			});
			const ov = new Map(D.charts.g2_classes.rows.map((r) => [r.run, r]));
			const ol = v.flatMap((r) => CLASSES.map((k, i) => ({ run: r.cycle, k, i, pct: ov.get(r.cycle)?.[k] ?? 0 })));
			put($(".c-ovh"), ol, (rs) => {
				const p = base($(".c-ovh"), {
					x: xBand(v, $(".c-ovh")),
					y: { grid: true, label: "% of run cost" },
					marks: [Plot.barY(rs, { x: "run", y: "pct", z: "k", fill: (d) => clsCol[d.i], stroke: (d) => (d.run === st.sel ? t.accent : "none"), strokeWidth: 2 })],
				});
				hook(p, 'g[aria-label="bar"] rect', rs, (d) => tipHtml({ head: `Run ${d.run}`, rows: [[d.k, `${d.pct}% of run cost`]], hint: "click opens run" }), openFromRow);
				const lg = document.createElement("div");
				lg.className = "mono";
				lg.innerHTML = CLASSES.map((k, i) => `<span class="sw" style="background:${clsCol[i]}"></span> ${k}`).join(" &nbsp;");
				const box = document.createElement("div");
				box.append(p, lg);
				return box;
			});
		};

		// Q2: per-combo dot spread on all-in $/pkg; two-line label (combo / n · median). Wide: labels in a left
		// gutter, dots alone in the plot. Narrow (< 720px): labels stacked above each row's dots.
		const drawQ2 = (v) => {
			const vr = v.filter((r) => allIn(r) != null);
			const cs = CB.filter((c) => vr.some((r) => r.combo === c.key)).map((c) => ({ ...c, low: lowN.has(c.key), med: median(RUNS.filter((r) => r.combo === c.key).map(allIn)) }));
			const byKey = new Map(cs.map((c) => [c.key, c]));
			put($(".spread"), vr, (rs) => {
				const host = $(".spread"), w = host.clientWidth || 340, wide = w >= 720;
				const stats = (c) => `n=${nOf.get(c.key) ?? "–"} · median ${fmt.usd(c.med)}${c.low ? " · low n" : ""}`;
				// name truncated to fit; full combo in the dot tooltip
				const fit = (s, px) => {
					if (textW(s) <= px) return s;
					while (s.length > 4 && textW(s + "…") > px) s = s.slice(0, -1);
					return s + "…";
				};
				const gut = wide ? Math.min(Math.ceil(d3.max(cs, (c) => Math.max(textW(c.short), textW(stats(c))))) + 16, Math.floor(w * 0.45)) : 0;
				const name = (c) => fit(c.short, wide ? gut - 16 : w - 40);
				const rowH = wide ? 40 : 58;
				const fill = (d) => (d.cycle === st.sel ? t.accent : byKey.get(d.combo).low ? "none" : byKey.get(d.combo).color);
				const stroke = (d) => (d.cycle === st.sel ? t.accent : byKey.get(d.combo).low ? byKey.get(d.combo).color : t.paper);
				const lab = (dx, anchor, dy) => [
					Plot.text(cs, { y: "key", text: name, frameAnchor: "left", textAnchor: anchor, dx, dy: dy[0], fill: t.ink }),
					Plot.text(cs, { y: "key", text: stats, frameAnchor: "left", textAnchor: anchor, dx, dy: dy[1], fill: t.muted }),
				];
				const labels = wide ? lab(-12, "end", [-7, 8]) : lab(0, "start", [-20, -6]);
				const p = base(host, {
					height: cs.length * rowH + 40, marginTop: 4, marginBottom: 36, marginLeft: wide ? gut : 14, marginRight: 14,
					y: { type: "band", domain: cs.map((c) => c.key), axis: null, padding: 0 },
					x: { domain: [0, d3.max(rs, allIn) || 1], grid: true, label: "all-in $/pkg", labelAnchor: "center", labelArrow: "none", ticks: Math.max(2, Math.floor((w - gut) / 90)), tickFormat: (d) => "$" + d },
					marks: [
						Plot.ruleY(cs, { y: "key", dy: rowH / 2, stroke: t.rule, strokeOpacity: 0.6 }),
						...labels,
						Plot.tickX(cs, { x: "med", y: "key", stroke: t.ink, strokeWidth: 2, insetTop: wide ? 9 : 33, insetBottom: wide ? 9 : 5 }),
						Plot.dot(rs, { x: allIn, y: "combo", dy: wide ? 0 : 14, r: (d) => (d.cycle === st.sel ? 6 : 4.5), fill, stroke, strokeWidth: (d) => (byKey.get(d.combo).low ? 1.5 : 1) }),
					],
				});
				hook(p, 'g[aria-label="dot"] circle', rs, (d) => runTip(d, [["combo median, all runs", fmt.usd(byKey.get(d.combo).med) + (byKey.get(d.combo).low ? ` (n=${nOf.get(d.combo)})` : "")]], [], "click opens run"), openFromRow);
				return p;
			});
			const inView = new Map();
			for (const r of v) inView.set(r.combo, (inView.get(r.combo) || 0) + 1);
			const cr = D.combos.filter((c) => !st.hidden.has(c.combo)).map((c) => ({ ...c, short: cOf(c.combo)?.short ?? c.combo, view: inView.get(c.combo) || 0, fpyp: c.fpy * 100 }));
			const host = $(".t-combo");
			if (!cr.length) return (host.innerHTML = `<p class="empty">${EMPTY}</p>`);
			const nNote = (f) => (x, r) => f(x) + (r.flag ? ` <span class="mono">n=${r.n}</span>` : "");
			sortTable(host, cr, [
				{ key: "short", label: "combo", fmt: (s, r) => `<span class="sw${r.flag ? " low" : ""}" style="background:${cOf(r.combo)?.color}"></span> <span title="${esc(r.combo)}">${esc(s)}</span>${r.flag ? ` <span class="tag">${esc(r.flag)}</span>` : ""}` },
				{ key: "n", label: "runs", num: true }, { key: "view", label: "in view", num: true },
				{ key: "usd_per_package", label: "all-in $/pkg", num: true, fmt: nNote(fmt.usd) }, { key: "build_usd_per_package", label: "build+fix $/pkg", num: true, fmt: fmt.usd },
				{ key: "fpyp", label: "FPY", num: true, fmt: nNote(fmt.pct) },
				{ key: "fix_rounds_per_pkg", label: "fix/pkg", num: true }, { key: "active_min_per_package", label: "min/pkg", num: true },
				{ key: "tool_err_per_100_req", label: "tool err/100", num: true },
			]);
		};

		// Q3: C's change cards. Event list + before/after bars (C's dumbbells) + A's seam charts with C's shaded seam.
		const EVENTS = [...D.events].sort((a, b) => b.cycle - a.cycle);
		const actPkg = (r) => (r.packages ? r.active_min / r.packages : null);
		const fpyPct = (r) => (r.first_pass_yield == null ? null : r.first_pass_yield * 100);
		const errRate = (r) => r.tool_err_per_100_req;
		// signed delta, sign taken from the rounded value so a tiny diff reads ±0
		const signed = (f, nd) => (d) => { const v = +d.toFixed(nd); return (v > 0 ? "+" : v < 0 ? "−" : "±") + f(Math.abs(v)); };
		// [label, value, format, delta format, dir] dir -1 = lower is better
		const METRICS = [
			["all-in $/pkg", allIn, fmt.usd, signed(fmt.usd, 3), -1],
			["first-pass yield", fpyPct, fmt.pct, fmt.pp, 1],
			["parallelism", (r) => r.parallelism, fmt.x, signed(fmt.x, 2), 1],
			["tool errors / 100 req", errRate, fmt.n1, signed(fmt.n1, 1), -1],
			["active min/pkg", actPkg, fmt.n1, signed(fmt.n1, 1), -1],
			["$/100 lines (all-in)", (r) => r.usd_per_100_lines, fmt.usd, signed(fmt.usd, 3), -1],
		];
		// Before/after per metric on the row's own scale: one dot per compared run (hollow = before lane, filled =
		// after lane), a tick per median, an arrow from the before median to the after median (green better, red
		// worse, grey when too few runs to call).
		const compare = (host, e, before, after) => {
			const lowCall = before.length < LOW_N || after.length < LOW_N;
			host.insertAdjacentHTML("beforeend", `<div class="db dbh"><span>metric</span><span><i></i>before run<i class="f"></i>after run<b></b>median · each row on its own scale</span><span>median before → after</span></div>`
				+ METRICS.map(([l, , , , dir]) => `<div class="db"><span class="m">${l}<small>${dir < 0 ? "lower" : "higher"} is better</small></span><svg aria-hidden="true"></svg><span class="v"></span></div>`).join(""));
			host.querySelectorAll(".db:not(.dbh)").forEach((row, i) => {
				const [l, k, f, df, dir] = METRICS[i];
				const v = row.querySelector(".v");
				const pts = [...before.map((r) => ({ r, after: false })), ...after.map((r) => ({ r, after: true }))].filter((p) => k(p.r) != null);
				const b = median(before.map(k)), a = median(after.map(k));
				if (a == null || b == null) return (v.textContent = "no data");
				const dTxt = df(a - b), flat = dTxt.startsWith("±");
				const cls = lowCall || flat ? "" : (a - b) * dir > 0 ? "good" : "bad";
				const word = lowCall ? "too few runs to call" : flat ? "no change" : cls === "good" ? "better" : "worse";
				v.innerHTML = `${f(b)} → ${f(a)}<span class="${lowCall ? "low-call" : cls}">${dTxt} · ${word}</span>`;
				const nb = before.filter((r) => k(r) != null).length, na = after.filter((r) => k(r) != null).length;
				const rowTip = (ev) => tip.show(ev, tipHtml({
					head: l, sub: dir < 0 ? "lower is better" : "higher is better",
					rows: [[`before median (${nb} run${nb === 1 ? "" : "s"})`, f(b)], [`after median (${na} run${na === 1 ? "" : "s"})`, f(a)], ["change", `${dTxt} · ${word}`]],
					notes: [`change at cycle ${e.cycle}`, ...(lowCall ? [`under ${LOW_N} runs on a side: no verdict`] : [])],
					hint: "hover a dot for its run",
				}));
				for (const el of [row.querySelector(".m"), v]) {
					el.addEventListener("pointermove", rowTip);
					el.addEventListener("pointerleave", tip.hide);
				}
				const node = row.querySelector("svg"), W = node.clientWidth || 200, yB = 8, yA = 22;
				const ext = d3.extent([...pts.map((p) => k(p.r)), a, b]);
				const pad = (ext[1] - ext[0]) * 0.06 || Math.abs(ext[0]) * 0.1 || 1;
				const x = d3.scaleLinear().domain([ext[0] - pad, ext[1] + pad]).range([6, W - 6]);
				const svg = d3.select(node);
				for (const y of [yB, yA]) svg.append("line").attr("x1", 0).attr("x2", W).attr("y1", y).attr("y2", y).attr("stroke", t.rule).attr("stroke-opacity", 0.6);
				const col = cls ? t[cls] : t.muted, xb = x(b), xa = x(a), s = Math.sign(xa - xb);
				if (Math.abs(xa - xb) > 10) svg.append("path").attr("d", `M${xb},15H${xa - s * 2}M${xa - s * 7},11L${xa - s * 2},15L${xa - s * 7},19`)
					.attr("fill", "none").attr("stroke", col).attr("stroke-width", 2).attr("stroke-dasharray", lowCall ? "3 2" : null);
				svg.append("line").attr("x1", xb).attr("x2", xb).attr("y1", yB - 7).attr("y2", yB + 7).attr("stroke", t.muted).attr("stroke-width", 2);
				svg.append("line").attr("x1", xa).attr("x2", xa).attr("y1", yA - 7).attr("y2", yA + 7).attr("stroke", t.ink).attr("stroke-width", 2);
				svg.append("g").selectAll("circle").data(pts).join("circle")
					.attr("cx", (p) => x(k(p.r))).attr("cy", (p) => (p.after ? yA : yB)).attr("r", (p) => (p.r.cycle === st.sel ? 6 : p.after ? 5 : 4.5))
					.attr("fill", (p) => (p.r.cycle === st.sel ? t.accent : p.after ? t.ink : t.paper))
					.attr("stroke", (p) => (p.r.cycle === st.sel ? t.accent : p.after ? t.ink : t.muted)).attr("stroke-width", 1.5)
					.style("cursor", "pointer")
					.on("pointermove", (ev, p) => tip.show(ev, tipHtml({
						head: `Run ${p.r.cycle}`, sub: p.after ? "after" : "before",
						lead: `<i style="background:${cOf(p.r.combo).color}"></i>${esc(cOf(p.r.combo).short)}`,
						rows: [[l, f(k(p.r))], [`${p.after ? "after" : "before"} median`, f(p.after ? a : b)]],
						hint: "click opens run",
					})))
					.on("pointerleave", tip.hide).on("click", (_, p) => openRun(p.r.cycle));
			});
		};
		const runs = (rs) => `${rs.length} run${rs.length === 1 ? "" : "s"} (${rs[0].cycle}${rs.length > 1 ? "–" + rs[rs.length - 1].cycle : ""})`;
		const drawEvents = () => {
			const ul = $(".evl");
			ul.innerHTML = EVENTS.map((ev, i) => `<li><button data-i="${i}" aria-current="${i === st.ev}"><b>cycle ${ev.cycle}</b><span class="k">${esc(ev.kinds.join(" · "))}</span><span class="l">${esc(ev.label)}</span></button></li>`).join("");
			ul.querySelectorAll("button").forEach((b) => b.onclick = () => {
				st.ev = +b.dataset.i;
				draw();
				$(`.evl button[data-i="${st.ev}"]`).focus();
			});
		};
		const seam = (p, v, key, f) => {
			const sx = p.scale("x");
			const svg = d3.select(p);
			const h = +p.getAttribute("height");
			const sel = EVENTS[st.ev];
			const placed = [];
			// selected seam first so its label always wins the collision check
			for (const e of [sel, ...EVENTS.filter((x) => x !== sel)]) {
				const after = v.filter((r) => r.cycle >= e.cycle);
				if (!after.length || after.length === v.length) continue;
				const xx = sx.apply(after[0].cycle) - (sx.step ?? 0) / 2;
				const before = v.filter((r) => r.cycle < e.cycle).slice(-5);
				const a5 = after.slice(0, 5);
				const on = e === sel;
				if (on) {
					// shade only the compared before window; hairline bracket over the compared after window
					const half = (sx.step ?? 0) / 2;
					const bx = sx.apply(before[0].cycle) - half, ax = sx.apply(a5[a5.length - 1].cycle) + half;
					svg.insert("rect", ":first-child").attr("x", bx).attr("y", 18).attr("width", Math.max(0, xx - bx)).attr("height", h - 48).attr("fill", t.rule).attr("fill-opacity", 0.35);
					svg.append("path").attr("d", `M${xx},24V18H${ax}V24`).attr("fill", "none").attr("stroke", t.ink).attr("stroke-width", 1);
				}
				svg.append("line").attr("x1", xx).attr("x2", xx).attr("y1", 18).attr("y2", h - 30).attr("stroke", on ? t.ink : t.muted).attr("stroke-width", on ? 1.5 : 1).attr("stroke-dasharray", on ? null : "2 2");
				// every label (selected included) goes through `placed`; fall back to the bare cycle, else drop
				const W0 = +p.getAttribute("width") - 4;
				const fits = (a, tw) => a >= 0 && a + tw <= W0 && !placed.some(([l, r]) => a < r + TICK_GAP && a + tw > l - TICK_GAP);
				for (const txt of [on ? `before | after ${e.cycle}` : `${e.cycle} ${e.kinds[0] ?? ""}`.trim(), String(e.cycle)]) {
					const tw = textW(txt);
					const x0 = [xx + 3, xx - 3 - tw].find((a) => fits(a, tw));
					if (x0 == null) continue;
					placed.push([x0, x0 + tw]);
					svg.append("text").attr("x", x0).attr("y", 12).attr("fill", on ? t.ink : t.muted).attr("font-size", 11).text(txt);
					break;
				}
				svg.append("rect").attr("x", xx - 6).attr("width", 12).attr("y", 0).attr("height", h - 30).attr("fill", "transparent").style("cursor", "help")
					.on("pointermove", (ev) => tip.show(ev, tipHtml({ head: `Cycle ${e.cycle}`, lead: esc(e.label), rows: [[`before, ${runs(before)}`, f(median(before.map(key)))], [`after, ${runs(a5)}`, f(median(a5.map(key)))]], notes: ["median of visible runs", ...(before.length < LOW_N || a5.length < LOW_N ? ["too few runs to call"] : [])] })))
					.on("pointerleave", tip.hide);
			}
		};
		const drawQ3 = (v) => {
			drawEvents();
			const e = EVENTS[st.ev];
			$(".evh").textContent = `Did the change at cycle ${e.cycle} help?`;
			const before = v.filter((r) => r.cycle < e.cycle).slice(-5), after = v.filter((r) => r.cycle >= e.cycle).slice(0, 5);
			const dbs = $(".dbs");
			if (!before.length || !after.length) dbs.innerHTML = `<p class="empty">Need visible runs on both sides of cycle ${e.cycle}. Widen the cycle range or turn a combo back on.</p>`;
			else {
				dbs.innerHTML = `<p class="mono">${esc(e.label)}<br>Compares up to 5 visible runs on each side: before = ${runs(before)}, after = ${runs(after)}.${before.length < LOW_N || after.length < LOW_N ? ` <span class="low-call">Too few runs to call</span>: under ${LOW_N} on a side, so no better/worse verdict yet.` : ""}</p>`;
				compare(dbs, e, before, after);
			}
			const line = (sel, key, f, tf) => put($(sel), v.filter((r) => key(r) != null), (rs) => {
				const bSet = new Set(before.map((r) => r.cycle));
				const faded = (d) => bSet.has(d.cycle) && d.cycle !== st.sel;
				const p = base($(sel), {
					marginTop: 20, x: xRun(v, $(sel)), y: { grid: true, label: null, tickFormat: tf },
					marks: [Plot.lineY(rs, { x: "cycle", y: key, stroke: t.c6 }), Plot.dot(rs, { x: "cycle", y: key, r: (d) => (d.cycle === st.sel ? 6 : 3.5), fill: markFill, fillOpacity: (d) => (faded(d) ? 0.45 : 1) })],
				});
				hook(p, 'g[aria-label="dot"] circle', rs, (d) => runTip(d, [], [], "click opens run"), openFromRow);
				seam(p, rs, key, f);
				return p;
			});
			line(".c-upp", allIn, fmt.usd, (d) => "$" + d);
			line(".c-fpy", fpyPct, fmt.pct);
			line(".c-par", (r) => r.parallelism, fmt.x, (d) => d + "×");
			line(".c-err", errRate, fmt.n1);
		};

		const drawGate = (v) => {
			const inV = new Set(v.map((r) => r.cycle));
			const g = D.gate_health.cycles.filter((c) => inV.has(c.cycle));
			const has = g.filter((c) => c.runs > 0).map((c) => ({ ...c, sharep: c.gate_share * 100, over: c.over_budget ? "over" : "ok" }));
			$(".g-note").textContent = `Budget ${D.gate_health.budget_s} s (frozen ${D.gate_health.frozen_s} s). ${g.length - has.length} of ${g.length} cycles in view have no gate data and are left out.`;
			const host = $(".t-gate");
			if (!has.length) return (host.innerHTML = `<p class="empty">No gate data for the runs in view. Widen the range toward cycle 33+.</p>`);
			sortTable(host, has, [
				{ key: "cycle", label: "cycle", num: true }, { key: "runs", label: "gate runs", num: true }, { key: "full_runs", label: "full", num: true },
				{ key: "median_full_s", label: "median s", num: true }, { key: "max_full_s", label: "max s", num: true },
				{ key: "sharep", label: "share of run", num: true, fmt: (x) => x.toFixed(1) + "%" },
				{ key: "over", label: "budget", fmt: (x) => `<span class="${x === "over" ? "bad" : ""}">${x}</span>` },
			], { onRow: (r) => openRun(r.cycle), sort: ["cycle", -1] });
		};

		const drawPanel = () => {
			if (st.sel == null) return (aside.hidden = true);
			const r = byCycle.get(st.sel), k = pad3(r.cycle), ch = D.charts;
			aside.hidden = false;
			const stats = [
				["all-in $/pkg", fmt.usd(allIn(r))], ["build+fix $/pkg", fmt.usd(r.usd_per_package)], ["cost", fmt.usd(r.cost)],
				["time", fmt.min(r.minutes), `active ${fmt.min(r.active_min)}`], ["parallelism", fmt.x(r.parallelism)], ["packages", r.packages],
				["first-pass yield", fmt.pct(r.first_pass_yield * 100)], ["tool errors", r.tool_err, `${fmt.n1(r.tool_err_per_100_req)} / 100 req`],
			];
			aside.innerHTML = `<header><div><h2>Run ${r.cycle}</h2><small>slice ${r.slice} · ${r.start.slice(0, 10)}</small></div><button class="close">Close</button></header>
<p class="combo"><span class="sw" style="background:${cOf(r.combo).color}"></span><span title="${esc(r.combo)}">${esc(cOf(r.combo).short)}</span></p>
<dl>${stats.map(([l, v, s]) => `<div><dt>${l}</dt><dd>${v}${s ? `<small>${s}</small>` : ""}</dd></div>`).join("")}</dl>${r.orch_bad > 0 ? `<p class="note">Orch counter read negative: counted as $0.</p>` : ""}
<h3>Phase cost waterfall</h3><div class="p-wf"></div><h3>Package cost, build vs fix</h3><div class="p-pk"></div><div class="tbl p-pt"></div><h3>Phase gantt (minutes from start)</h3><div class="p-gt"></div>`;
			aside.querySelector(".close").onclick = closeRun;
			const pw = (s) => aside.querySelector(s);
			const pb = (s, o) => base(pw(s), { ...o, width: aside.clientWidth - 32 });
			let acc = 0;
			const wf = (ch[`run${k}_waterfall`]?.rows ?? []).map((d) => ({ ...d, y1: acc, y2: (acc += d.usd) }));
			put(pw(".p-wf"), wf, (rs) => {
				const p = pb(".p-wf", { x: { domain: rs.map((d) => d.phase), label: null }, y: { grid: true, label: "cumulative USD" },
					marks: [Plot.barY(rs, { x: "phase", y1: "y1", y2: "y2", fill: t.c1 }), Plot.ruleY([0], { stroke: t.rule })] });
				hook(p, 'g[aria-label="bar"] rect', rs, (d) => tipHtml({ head: esc(d.phase), rows: [["phase cost", fmt.usd(d.usd)], ["running total", fmt.usd(d.y2)]] }));
				return p;
			});
			const pk = ch[`run${k}_pkgs`]?.rows ?? [];
			const pl = pk.flatMap((d) => [{ package: d.package, k: "build", usd: d.build_usd }, { package: d.package, k: "fix", usd: d.fix_usd }]);
			put(pw(".p-pk"), pl, (rs) => {
				const p = pb(".p-pk", { height: 24 + pk.length * 20, marginLeft: 110, x: { grid: true, label: "USD" }, y: { label: null, domain: pk.map((d) => d.package) },
					marks: [Plot.barX(rs, { y: "package", x: "usd", z: "k", fill: (d) => (d.k === "build" ? t.c1 : t.c2) })] });
				hook(p, 'g[aria-label="bar"] rect', rs, (d) => tipHtml({ head: esc(d.package), rows: [[d.k, fmt.usd(d.usd)]] }));
				return p;
			});
			if (pk.length) sortTable(pw(".p-pt"), pk.map((d) => ({ ...d, total: d.build_usd + d.fix_usd })), [
				{ key: "package", label: "package" }, { key: "build_usd", label: "build", num: true, fmt: fmt.usd },
				{ key: "fix_usd", label: "fix", num: true, fmt: fmt.usd }, { key: "total", label: "total", num: true, fmt: fmt.usd }]);
			// idle gaps over GAP_MIN are collapsed to GAP_KEEP minutes so one stalled stretch cannot squeeze the phases; tooltips keep real times
			const GAP_MIN = 30, GAP_KEEP = 5;
			const gt0 = ch[`run${k}_gantt`]?.rows ?? [];
			let shift = 0, reach = -Infinity, collapsed = false;
			const gt = [...gt0].sort((a, b) => a.start_min - b.start_min).map((d) => {
				if (reach > -Infinity && d.start_min - reach > GAP_MIN) { shift += d.start_min - reach - GAP_KEEP; collapsed = true; }
				reach = Math.max(reach, d.end_min);
				return { ...d, s: d.start_min - shift, e: d.end_min - shift };
			});
			if (collapsed) pw(".p-gt").insertAdjacentHTML("beforebegin", `<p class="note">Idle gaps over ${GAP_MIN} min are shortened; axis is active minutes.</p>`);
			put(pw(".p-gt"), gt, (rs) => {
				const p = pb(".p-gt", { height: 40 + new Set(rs.map((d) => d.phase)).size * 24, marginLeft: 70, x: { grid: true, label: "minutes" }, y: { label: null, domain: [...new Set(rs.map((d) => d.phase))] },
					marks: [Plot.barX(rs, { y: "phase", x1: "s", x2: "e", fill: (d) => (d.fix ? t.c2 : t.c1), insetTop: 3, insetBottom: 3 })] });
				hook(p, 'g[aria-label="bar"] rect', rs, (d) => tipHtml({ head: esc(d.phase), sub: esc(d.label) + (d.fix ? " · fix" : ""), rows: [["minutes", `${d.start_min}–${d.end_min}`]] }));
				return p;
			});
		};

		let lastFocus = null;
		const openRun = (c) => {
			lastFocus = document.activeElement;
			st.sel = c;
			draw();
			aside.querySelector(".close")?.focus();
		};
		const closeRun = () => {
			st.sel = null;
			$(".open").value = "";
			draw();
			lastFocus?.focus?.();
		};
		window.__va1Key && removeEventListener("keydown", window.__va1Key);
		window.__va1Key = (e) => e.key === "Escape" && app.classList.contains("rep") && st.sel != null && closeRun();
		addEventListener("keydown", window.__va1Key);

		function draw() {
			tip.hide();
			$(".from").value = st.lo;
			$(".to").value = st.hi;
			// Fix 7: reserve room for the drill panel before charts measure their hosts
			app.classList.toggle("drill", st.sel != null);
			app.style.setProperty("--toph", $(".top").offsetHeight + "px");
			const v = vis();
			drawStrip();
			drawQ1(v);
			drawQ2(v);
			drawQ3(v);
			drawGate(v);
			drawPanel();
		}
		window.__repRO?.disconnect();
		let tmr, lastW = 0;
		window.__repRO = new ResizeObserver(() => {
			clearTimeout(tmr);
			tmr = setTimeout(() => {
				if (!app.isConnected || !app.classList.contains("rep") || app.clientWidth === lastW) return;
				lastW = app.clientWidth;
				draw();
			}, 100);
		});
		window.__repRO.observe(app);
		draw();
	}
};

</script>
<script>/* boot.js */
// Render the report into #app; re-render on system theme change (Plot bakes resolved colours into the SVG).
(() => {
	const app = document.getElementById("app");
	const render = () => {
		app.replaceChildren();
		app.className = "rep";
		tip.hide();
		renderReport(app, DATA);
	};
	matchMedia("(prefers-color-scheme: dark)").addEventListener("change", render);
	render();
})();

</script>
</body></html>
